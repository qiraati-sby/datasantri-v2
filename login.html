<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Lembaga - Qiraati Surabaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <img src="https://e-qiraati.com/img/qiraati_gold.png" alt="Logo Qiraati" class="mx-auto h-28 mb-6 drop-shadow-md">
            <h1 class="text-2xl font-extrabold text-slate-800">Login Admin Lembaga</h1>
            <p class="text-slate-500 mt-2 text-sm italic">baca bismillahirrohmanirrahim sebelum memulai</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-slate-700 text-sm font-semibold mb-2" for="username">Username Lembaga</label>
                <input class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition" type="text" id="username" required>
            </div>
            <div>
                <label class="block text-slate-700 text-sm font-semibold mb-2" for="password">Password</label>
                <input class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition" type="password" id="password" required>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5">
                Masuk ke Dashboard
            </button>
            <p id="loginMessage" class="text-red-500 text-sm text-center font-medium hidden mt-4"></p>
        </form>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-slate-400 hover:text-amber-600 text-sm font-medium transition">&larr; Kembali ke Beranda Publik</a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
